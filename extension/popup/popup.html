<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobScale Auto-Apply</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 12px;
      color: #94a3b8;
    }
    
    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #94a3b8;
    }
    
    .status-dot.active {
      background: #14b8a6;
      animation: pulse 2s infinite;
    }
    
    .status-dot.complete {
      background: #22c55e;
    }
    
    .status-text {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }
    
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #14b8a6, #2dd4bf);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    
    .progress-text {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    
    .stat {
      text-align: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    
    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
    }
    
    .stat.success .stat-value { color: #22c55e; }
    .stat.failed .stat-value { color: #ef4444; }
    .stat.pending .stat-value { color: #f59e0b; }
    
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #14b8a6, #2dd4bf);
      color: #0f172a;
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(20, 184, 166, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    .job-list {
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .job-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    
    .job-item.success { border-left: 3px solid #22c55e; }
    .job-item.failed { border-left: 3px solid #ef4444; }
    .job-item.pending { border-left: 3px solid #f59e0b; }
    
    .job-title {
      flex: 1;
      color: #f1f5f9;
    }
    
    .job-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #94a3b8;
    }
    
    .empty-state-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
    
    .empty-state p {
      font-size: 13px;
      line-height: 1.5;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ JobScale Auto-Apply</h1>
    <p>Automatically apply to pre-approved jobs</p>
  </div>
  
  <div class="status-card">
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Ready to start</span>
    </div>
    
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    
    <div class="progress-text" id="progressText">0 / 0 jobs</div>
    
    <div class="stats" id="statsContainer" style="display: none;">
      <div class="stat success">
        <div class="stat-value" id="successCount">0</div>
        <div class="stat-label">Success</div>
      </div>
      <div class="stat failed">
        <div class="stat-value" id="failedCount">0</div>
        <div class="stat-label">Failed</div>
      </div>
      <div class="stat pending">
        <div class="stat-value" id="pendingCount">0</div>
        <div class="stat-label">Pending</div>
      </div>
    </div>
  </div>
  
  <div class="actions">
    <button class="btn btn-secondary" id="stopBtn" style="display: none;">Stop</button>
    <button class="btn btn-primary" id="startBtn">Start Auto-Apply</button>
    <button class="btn btn-secondary" id="dashboardBtn">Dashboard</button>
  </div>
  
  <div class="job-list" id="jobList" style="display: none;">
    <!-- Jobs will be populated here -->
  </div>
  
  <div class="empty-state" id="emptyState">
    <div class="empty-state-icon">📋</div>
    <p>Select jobs from your JobScale dashboard to start auto-applying</p>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
